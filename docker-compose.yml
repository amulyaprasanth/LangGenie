services:
  ollama:
    build:
      context: ./ollama/
      dockerfile: ./Dockerfile
    ports:
      - '11434:11434'
    entrypoint: [ "/usr/bin/bash", "/pull-llama3.sh" ]
    networks:
      - ollama-net
    image: amulyaprasanth/ollama_llama3.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend/
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    networks:
      - ollama-net
    image: amulyaprasanth/langgenie_backend_ollama

  app:
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile
    ports:
      - "3000:80"
    image: amulyaprasanth/langgenie_frontend_ollama

networks:
  ollama-net:
    driver: bridge
